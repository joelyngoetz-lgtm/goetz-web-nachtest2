<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Vorname Nachname - Klasse</title>
</head>
<body style="background-color: #f5f0e8;">

  <h1>Vorname Nachname - Klasse</h1>

  <h2>Geografische Fakten</h2>
  <p>
    Die Traumstadt: Wien<br>
    Einwohnerzahl: ca. 1.900.000 Einwohner
  </p>

  <h2>Top 3 Sehenswürdigkeiten</h2>
  <ol>
    <li>Stephansdom</li>
    <li>Schloss Schönbrunn</li>
    <li>Kunsthistorisches Museum</li>
  </ol>

  <h2>Kulinarische Spezialitäten</h2>
  <ul id="liste-essen"></ul>

  <h2>Visueller Eindruck</h2>
  <figure>
  <img
    src="img/wahrzeichen.jpg"
    width="450"
    height="auto"
    title="Vorgegebenes Bild"
    alt="Blick auf den unvollendeten Nordturm des Stephansdoms in Wien, der markant über die Dächer der Innenstadt ragt."
  >
  <figcaption>
    Fotograf:
    <a href="https://commons.wikimedia.org/wiki/User:Gryffindor" target="_blank">Gryffindor</a>
    –
    <a href="https://commons.wikimedia.org/wiki/File:Stephansdom_Nordturm_01.JPG" target="_blank">Stephansdom Nordturm 01.JPG</a>
    – Lizenz:
    <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank">CC BY-SA 3.0</a>
  </figcaption>
</figure>
<script>
  const essen = ["Wiener Schnitzel", "Tafelspitz", "Apfelstrudel", "Österreich"];
  const liste = document.getElementById("liste-essen");
  essen.forEach(h => {
    let li = document.createElement("li");
    li.textContent = h;
    liste.appendChild(li);
  });
</script>
</body>
</html>
